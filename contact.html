<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Get in touch with Suman Kapri for collaborations, projects, or inquiries." />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header>
        <nav>
            <div class="logo">Suman<span>.</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="skills.html">Skills</a></li>

                <li><a href="certifications.html">Certifications</a></li>

                <li><a href="https://github.com/suman222222" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a></li>
                <li><button class="theme-toggle" type="button"><span class="theme-icon">☀</span></button></li>
            </ul>
        </nav>
    </header>

    <section class="page-hero">
        <div class="page-hero-content">
            <h1>Get In <span>Touch</span></h1>
            <p>Have a project idea, collaboration proposal, or just want to say hello? Reach out!</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required />
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Project Collaboration" />
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell me about your project or idea..." required></textarea>
                </div>
                <button type="submit" class="btn-glow">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
            </form>

            <div class="contact-social">
                <a href="mailto:kaprisuman222@gmail.com" target="_blank" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="https://github.com/suman222222" target="_blank" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/suman-kapri/" target="_blank" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Suman Kapri</p>
        <div class="footer-social">
            <a href="https://github.com/suman222222" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/suman-kapri/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
